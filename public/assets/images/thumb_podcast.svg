    <path d="M40,120 C40,220 200,220 200,120" fill="none" stroke="#ff0055" stroke-width="8"/>
    <line x1="120" y1="210" x2="120" y2="280" stroke="#ff0055" stroke-width="10"/>
    <line x1="60" y1="280" x2="180" y2="280" stroke="#ff0055" stroke-width="10"/>
  </g>

