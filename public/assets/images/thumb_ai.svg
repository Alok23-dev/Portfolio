<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#050508;">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="50%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#140510"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ff0055"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#cyberBg)"/>

  <!-- Cyber Grid Lines -->
  <g stroke="#00f0ff" stroke-opacity="0.15" stroke-width="1">
    <path d="M0,120 H1280 M0,240 H1280 M0,360 H1280 M0,480 H1280 M0,600 H1280"/>
    <path d="M160,0 V720 M320,0 V720 M480,0 V720 M640,0 V720 M800,0 V720 M960,0 V720 M1120,0 V720"/>
  </g>

  <!-- Left/Right Split Graphic Focus -->
  <circle cx="640" cy="380" r="280" fill="url(#neonGlow)" opacity="0.25"/>
  <circle cx="640" cy="380" r="200" fill="#00f0ff" opacity="0.1"/>

  <!-- Holographic AI Brain Node Grid Visual -->
  <g transform="translate(440, 200)">
    <circle cx="200" cy="180" r="140" stroke="#00f0ff" stroke-width="4" fill="none" stroke-dasharray="10,5"/>
    <polygon points="200,60 300,240 100,240" fill="none" stroke="#ff0055" stroke-width="3"/>
    <circle cx="200" cy="60" r="10" fill="#00f0ff"/>
    <circle cx="300" cy="240" r="10" fill="#ff0055"/>
    <circle cx="100" cy="240" r="10" fill="#ffff00"/>
  </g>

  <!-- Giant High CTR Top Headline Typography -->
  <rect x="140" y="70" width="1000" height="130" rx="16" fill="#000000" opacity="0.8" stroke="#ffff00" stroke-width="3"/>
  <text x="640" y="155" font-family="'Impact', 'Arial Black', sans-serif" font-size="92" fill="#ffff00" text-anchor="middle" letter-spacing="4">AI WILL CHANGE EVERYTHING</text>

  <!-- Subtitle Hook -->
  <rect x="280" y="580" width="720" height="80" rx="40" fill="#ff0055"/>
  <text x="640" y="635" font-family="'Impact', 'Arial Black', sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">THE UNSTOPPABLE FUTURE REVEALED</text>
</svg>
