<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%" style="background:#04150c;">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe259"/>
      <stop offset="100%" stop-color="#ffa751"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="720" fill="#04150c"/>

  <!-- Ascending Stock Chart Green Vectors -->
  <path d="M50,600 L300,500 L500,550 L800,250 L1000,300 L1230,100" fill="none" stroke="#00ff88" stroke-width="12" stroke-linecap="round"/>
  <polygon points="50,600 300,500 500,550 800,250 1000,300 1230,100 1230,680 50,680" fill="#00ff88" opacity="0.15"/>

  <!-- Stacks of Gold Coins Graphics -->
  <g transform="translate(150, 420)">
    <ellipse cx="60" cy="180" rx="60" ry="20" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="60" cy="150" rx="60" ry="20" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="60" cy="120" rx="60" ry="20" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="60" cy="90" rx="60" ry="20" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="2"/>
  </g>

  <!-- Big Bold Text Headline -->
  <g transform="translate(640, 220)">
    <text x="0" y="0" font-family="'Impact', sans-serif" font-size="110" fill="#e63946" stroke="#ffffff" stroke-width="6" text-anchor="middle">GET WEALTHY</text>
    <text x="0" y="110" font-family="'Impact', sans-serif" font-size="130" fill="url(#goldGrad)" stroke="#000000" stroke-width="8" text-anchor="middle">FAST!</text>
  </g>

  <!-- High CTR Callout Badge -->
  <rect x="440" y="540" width="400" height="80" rx="20" fill="#e63946" stroke="#ffffff" stroke-width="3"/>
  <text x="640" y="595" font-family="'Impact', sans-serif" font-size="42" fill="#ffffff" text-anchor="middle">10X YOUR INCOME IN 2024</text>
</svg>
