<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="g1" x1="0" x2="1">
      <stop offset="0" stop-color="#0A0A0C"/>
      <stop offset="1" stop-color="#18181F"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="6" result="off"/>
      <feComposite in="off" in2="SourceAlpha" operator="arithmetic" k2="-1" k3="1" result="emboss"/>
      <feMerge><feMergeNode in="emboss"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#g1)"/>

  <!-- Packaging box -->
  <g transform="translate(110,120)" filter="url(#emboss)">
    <rect x="0" y="0" width="520" height="360" rx="18" fill="#0D0D0F" stroke="#E63946" stroke-opacity="0.06"/>
    <text x="40" y="70" fill="#E63946" font-family="Syne, sans-serif" font-size="42" font-weight="700">NEXUS</text>
    <rect x="40" y="90" width="180" height="6" rx="3" fill="#E63946" opacity="0.12"/>
    <text x="40" y="150" fill="#CFCFD3" font-family="JetBrains Mono, monospace" font-size="14">Luxury Acoustic Precision</text>
  </g>

  <!-- Headphone silhouette -->
  <g transform="translate(700,120)">
    <path d="M180 60 C180 20 140 0 100 0 C60 0 20 20 20 60 L20 220 C20 240 40 260 60 260 L140 260 C160 260 180 240 180 220 Z" fill="#0A0A0C" stroke="#E63946" stroke-width="4"/>
    <ellipse cx="100" cy="250" rx="86" ry="48" fill="#070708" stroke="#1A1A1E"/>
    <g transform="translate(-20,20)">
      <rect x="-40" y="40" width="280" height="6" rx="3" fill="#E63946" opacity="0.08"/>
    </g>
  </g>

  <!-- Business cards stack -->
  <g transform="translate(420,520)" opacity="0.95">
    <rect x="0" y="0" width="260" height="150" rx="12" fill="#0C0C0D" stroke="#111113"/>
    <rect x="12" y="12" width="236" height="126" rx="8" fill="#0A0A0C"/>
    <text x="22" y="48" fill="#E63946" font-family="Syne, sans-serif" font-size="20" font-weight="700">N</text>
    <text x="52" y="50" fill="#E2E2E8" font-family="JetBrains Mono, monospace" font-size="12">NEXUS AUDIO</text>
    <rect x="0" y="170" width="260" height="6" rx="3" fill="#E63946" opacity="0.06"/>
  </g>

  <!-- Metallic foil highlight strip -->
  <g transform="translate(1100,520)">
    <rect x="0" y="0" width="420" height="260" rx="14" fill="#0A0A0C"/>
    <rect x="18" y="18" width="384" height="224" rx="10" fill="#0C0C0D"/>
    <text x="40" y="86" fill="#E63946" font-family="Syne, sans-serif" font-size="28" font-weight="700">Foil Mockup</text>
    <text x="40" y="120" fill="#CFCFD3" font-family="JetBrains Mono, monospace" font-size="12">Matte black with crimson foil accents</text>
  </g>

  <!-- Footer line / composition balance -->
  <rect x="80" y="940" width="1440" height="20" fill="#0A0A0C" opacity="0.6"/>
</svg>