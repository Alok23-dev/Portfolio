<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="100%" height="100%" style="background:#0a0a0c;">
  <defs>
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181822"/>
      <stop offset="100%" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#ff4d5a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1500" fill="url(#heroBg)"/>

  <!-- Layer 1: Luxury Branding Mockup Box -->
  <g transform="translate(100, 150) rotate(-4)">
    <rect width="700" height="460" rx="20" fill="#12121a" stroke="#e63946" stroke-width="2"/>
    <path d="M100,100 L160,100 L220,220 L220,100 L260,100 L260,260 L200,260 L140,140 L140,260 L100,260 Z" fill="url(#foil)"/>
    <text x="290" y="160" font-family="'Syne', sans-serif" font-weight="900" font-size="44" fill="#ffffff">NEXUS AUDIO</text>
    <text x="290" y="200" font-family="monospace" font-size="16" fill="#e63946">LUXURY BRAND IDENTITY</text>
  </g>

  <!-- Layer 2: YouTube Thumbnail Card -->
  <g transform="translate(350, 450) rotate(5)">
    <rect width="740" height="420" rx="20" fill="#050b14" stroke="#00f0ff" stroke-width="3"/>
    <text x="370" y="200" font-family="'Impact', sans-serif" font-size="62" fill="#ffff00" text-anchor="middle">AI WILL CHANGE EVERYTHING</text>
    <rect x="220" y="270" width="300" height="50" rx="25" fill="#e63946"/>
    <text x="370" y="303" font-family="monospace" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="middle">HIGH CTR THUMBNAIL DESIGN</text>
  </g>

  <!-- Layer 3: Swiss Exhibition Poster Card -->
  <g transform="translate(150, 850) rotate(-2)">
    <rect width="840" height="520" rx="20" fill="#121218" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/>
    <text x="80" y="140" font-family="'Syne', sans-serif" font-weight="900" font-size="70" fill="#ffffff">SWISS GRAPHIQUE</text>
    <text x="80" y="220" font-family="'Syne', sans-serif" font-weight="900" font-size="70" fill="#e63946">2024 POSTER</text>
    <rect x="80" y="280" width="400" height="160" fill="url(#foil)"/>
    <text x="120" y="380" font-family="'Syne', sans-serif" font-weight="800" font-size="32" fill="#ffffff">EDITORIAL DESIGN</text>
  </g>
</svg>
