<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <rect width="100%" height="100%" fill="#0A0A0C"/>
  <g transform="translate(40,40)">
    <text x="0" y="40" fill="#E63946" font-family="Syne, sans-serif" font-size="28">YOUTUBE THUMBNAILS</text>
    <g transform="translate(0,80)">
      <!-- 4x2 thumbnail grid -->
      <g>
        <rect x="0" y="0" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="340" y="0" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="680" y="0" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="1020" y="0" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>

        <rect x="0" y="220" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="340" y="220" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="680" y="220" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
        <rect x="1020" y="220" width="320" height="180" rx="8" fill="#111113" stroke="#222"/>
      </g>

      <!-- Bold text overlays on thumbnails -->
      <g fill="#E63946" font-family="Syne, sans-serif" font-size="22" font-weight="700">
        <text x="20" y="120">AI REVOLUTION</text>
        <text x="360" y="120">GET WEALTHY</text>
        <text x="700" y="120">BUSINESS HACK</text>
        <text x="1040" y="120">PODCAST</text>
      </g>

      <!-- Lower row labels -->
      <g fill="#E2E2E8" font-family="JetBrains Mono, monospace" font-size="12">
        <text x="20" y="340">Technology & AI</text>
        <text x="360" y="340">Finance</text>
        <text x="700" y="340">Business</text>
        <text x="1040" y="340">Podcast</text>
      </g>
    </g>
  </g>
</svg>