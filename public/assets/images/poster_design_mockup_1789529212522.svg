<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
  <rect width="100%" height="100%" fill="#0A0A0C"/>
  <text x="40" y="60" fill="#E63946" font-family="Syne, sans-serif" font-size="28">SWISS GRAPHIQUE 2024</text>
  <g transform="translate(40,100)">
    <!-- Three modernist posters side by side -->
    <rect x="0" y="0" width="400" height="700" rx="8" fill="#111113" stroke="#222"/>
    <rect x="460" y="0" width="400" height="700" rx="8" fill="#111113" stroke="#222"/>
    <rect x="920" y="0" width="400" height="700" rx="8" fill="#111113" stroke="#222"/>

    <!-- Geometric elements -->
    <g fill="#E63946">
      <rect x="60" y="80" width="280" height="24" rx="4"/>
      <circle cx="660" cy="300" r="48"/>
      <rect x="980" y="540" width="160" height="160"/>
    </g>

    <!-- Typographic samples -->
    <g fill="#E2E2E8" font-family="Syne, sans-serif" font-size="36">
      <text x="80" y="180">GRID</text>
      <text x="520" y="220">TYPO</text>
      <text x="1000" y="260">POSTER</text>
    </g>
  </g>
</svg>